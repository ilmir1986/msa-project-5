filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /usr/share/dockerlogs/data/*/*.log
      - /var/log/batch-app/batch.log
    multiline.pattern: '^[[:space:]]'
    multiline.negate: false
    multiline.match: after

output.logstash:
  hosts: ["logstash:5044"]

processors:
  - add_host_metadata: ~
  - add_docker_metadata: ~
