input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  # Парсим JSON из поля "message" (туда Filebeat кладёт stdout контейнера)
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => ""          # распаковывать в корень события
      remove_field => ["message"]  # опционально: убрать исходное поле после парсинга
    }
  }

  # Обработка ошибок парсинга (опционально, но рекомендуется)
  if "_jsonparsefailure" in [tags] {
    mutate {
      add_tag => ["json_parse_error"]
      add_field => { "parse_error_message" => "%{message}" }
    }
  }

  # Добавляем временную метку обработки (для отладки)
  mutate {
    add_field => { "logstash_processed_at" => "%{@timestamp}" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]  # ← явный протокол + порт
    manage_template => false
    index => "%{[@metadata][beat]}-%{[@metadata][version]}-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }  # оставить для отладки, в prod можно убрать
}