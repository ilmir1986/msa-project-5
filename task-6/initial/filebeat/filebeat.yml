filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*-json.log
    processors:
      - add_docker_metadata: ~
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true

output.logstash:
  hosts: ["logstash:5044"]

# Включаем вывод в stderr для отладки
logging.level: info
logging.to_stderr: true